name: azure-private-dns-zone
description: An Azure private DNS zone linked to the connected network. A private endpoint registers its name in this zone.
source_url: https://github.com/massdriver-catalogs/azure/tree/main/bundles/azure-private-dns-zone
version: 0.0.0

params:
  examples:
    - __name: Blob storage
      zone_name: privatelink.blob.core.windows.net
      registration_enabled: false
    - __name: PostgreSQL
      zone_name: privatelink.postgres.database.azure.com
      registration_enabled: false
    - __name: SQL Server
      zone_name: privatelink.database.windows.net
      registration_enabled: false
    - __name: Key Vault
      zone_name: privatelink.vaultcore.azure.net
      registration_enabled: false
  required:
    - zone_name
  properties:
    zone_name:
      type: string
      title: Zone Name
      description: The name space of the zone. Azure cannot rename a zone.
      default: privatelink.blob.core.windows.net
      minLength: 1
      maxLength: 253
      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
      message:
        pattern: "Must be a lowercase DNS name with at least one dot, such as privatelink.blob.core.windows.net."
      $md.immutable: true
    registration_enabled:
      type: boolean
      title: Register Virtual Machines
      description: Azure writes a record for every virtual machine in the linked network. A zone for private endpoints does not need this.
      default: false

dependencies:
  azure_service_principal:
    resource_type: azure-service-principal@0.0.0
    required: true
  network:
    resource_type: virtual-network@0.0.0
    required: true

resources:
  zone:
    resource_type: private-dns-zone@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - zone_name
    - registration_enabled
    - "*"
  zone_name:
    ui:help: "Each Azure service has its own private link zone name. Read the Microsoft list before you type one."
  registration_enabled:
    ui:help: "One network can hold one zone with registration on. Leave this off for a private endpoint zone."
