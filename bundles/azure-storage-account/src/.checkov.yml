# Each skip carries the reason that the platform team accepted.
skip-check:
  # The bundle creates the key and the encryption identity when a key vault is
  # connected. Checkov reads the code without the connection, so it cannot see
  # them. Without a vault, Azure encrypts with its own key, and infrastructure
  # encryption adds a second layer.
  - CKV2_AZURE_1
  # The bundle writes this record when a log workspace is connected. Checkov
  # reads the code without the connection, so it cannot see the setting.
  - CKV2_AZURE_21
  # The bundle creates the endpoint when a private DNS zone is connected.
  # Checkov reads the code without the connection, so it cannot see it. The
  # network rules already refuse every source outside the network.
  - CKV2_AZURE_33
  # The account holds no queue. Only the blob service is in use.
  - CKV_AZURE_33
  # The network rules deny by default, and no nested item can be public. The
  # account answers the connected network only.
  - CKV_AZURE_59
  # Azure sets the expiry when it rotates the key, and the key carries a
  # rotation policy. A fixed date in the code drifts on every deployment.
  - CKV_AZURE_40
  # A hardware module key needs a premium vault. The key type follows the level
  # that the connected vault publishes.
  - CKV_AZURE_112
